# GPT model configuration: GPT-2 medium, 24 layers x 1024 dims (~355M with tied embeddings)
# Every key is optional; see configs/config.py for defaults. Floats need a decimal point (6.0e-4, not 6e-4).

run:
  output_dir: outputs
  device: null  # cpu, mps or cuda. If null, the best available one is selected
  seed: 42

data:
  source: wikipedia  # alice | wikipedia (can be overridden with --data)
  subset_ratio: 0.001  # Fraction of Wikipedia articles to use (e.g. 0.1 = 10%)
  val_ratio: 0.1
  stride: null  # Sliding-window stride for training samples; null = context_length (no overlap)

training:
  num_epochs: 1
  batch_size: 4  # Lower it (or raise grad_accum_steps) if you run out of memory
  grad_accum_steps: 8
  learning_rate: 3.0e-4  # Peak learning rate after warmup
  min_lr: 3.0e-5  # Final learning rate of the cosine decay
  warmup_ratio: 0.05
  weight_decay: 0.1
  grad_clip: 1.0
  precision: auto  # auto picks bf16 (Ampere+), fp16 (older GPUs) or fp32 (CPU / MPS)
  compile: false  # torch.compile; needs Triton (Linux + CUDA)
  grad_checkpointing: true  # Saves memory for long contexts at ~20% extra compute
  eval_interval: 50  # Optimizer steps between evaluations
  eval_batches: 20
  early_stopping_patience: 5  # Evaluations without val improvement before stopping (0 = off)
  sample_interval: 250  # Optimizer steps between generated samples (0 = off)
  save_interval: 500  # Optimizer steps between resumable last.pt saves (0 = only at the end)

generation:
  prompt: "Water is essential for all forms of life because"
  max_new_tokens: 50
  temperature: 0.8
  top_k: 50
  top_p: 0.9
  repetition_penalty: 1.5
  no_repeat_ngram_size: 3
  num_beams: 1  # > 1 uses beam search
  do_sample: true  # false = greedy decoding

model:
  vocab_size: 50257
  context_length: 1024
  emb_dim: 1024
  n_heads: 16
  n_layers: 24
  drop_rate: 0.1
  qkv_bias: true
  tie_weights: true
